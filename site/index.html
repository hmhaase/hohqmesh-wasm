<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOHQMesh in the Browser</title>
<script>
  // Before first paint, so a stored theme never flashes the other one.
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<script src="vendor/plotly.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e2e1dc; --accent: #2563eb; --accent-text: #ffffff;
    --err: #b91c1c; --ok: #15803d; --code-bg: #fbfbfa; --grid: #ecebe6; --line: #1f2937;
    --tab-active: #ffffff; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --text: #e8e8e3; --muted: #9a9a93;
      --border: #33332f; --accent: #60a5fa; --accent-text: #0b1220;
      --err: #f87171; --ok: #4ade80; --code-bg: #1a1a18; --grid: #2c2c29; --line: #d1d5db;
      --tab-active: #1a1a18; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --text: #e8e8e3; --muted: #9a9a93;
    --border: #33332f; --accent: #60a5fa; --accent-text: #0b1220;
    --err: #f87171; --ok: #4ade80; --code-bg: #1a1a18; --grid: #2c2c29; --line: #d1d5db;
    --tab-active: #1a1a18; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  h1 a { color: var(--muted); font-weight: 400; font-size: 12px; text-decoration: none; margin-left: 6px; }
  h1 a:hover { text-decoration: underline; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  select, button, label.file {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  button:hover, label.file:hover, select:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 6px 18px; }
  button.primary.stop { background: var(--err); border-color: var(--err); }
  label.file input { display: none; }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 12ch; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  main {
    flex: 1; min-height: 0; display: grid; padding: 12px 16px;
    grid-template-columns: minmax(260px, var(--left-width, 40%)) 12px minmax(300px, 1fr);
  }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #editorPanel { flex: 0 0 var(--editor-height, 60%); min-height: 120px; }
  #logPanel { flex: 1 1 0; min-height: 80px; }
  .splitter { position: relative; touch-action: none; }
  .splitter::after { content: ""; position: absolute; border-radius: 2px; background: var(--border); transition: background 0.15s; }
  .splitter:hover::after, .splitter.active::after { background: var(--accent); }
  .splitter.v { cursor: col-resize; }
  .splitter.v::after { left: 5px; width: 2px; top: 0; bottom: 0; }
  .splitter.h { cursor: row-resize; height: 12px; flex: none; }
  .splitter.h::after { top: 5px; height: 2px; left: 0; right: 0; }
  body.resizing { user-select: none; }
  body.resizing #plot { pointer-events: none; }
  label.toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); cursor: pointer; }
  label.toggle[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel > .title {
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .panel > .title .right { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: flex-end; text-transform: none; letter-spacing: 0; }
  .tabs { display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .tab {
    display: flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0;
    padding: 4px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; background: transparent;
  }
  .tab.active { background: var(--tab-active); color: var(--text); border-color: var(--border); margin-bottom: -1px; }
  .tab .x { border: 0; background: none; padding: 0 2px; color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; }
  .tab .x:hover { color: var(--err); }
  .tab .kind { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
  textarea, pre {
    flex: 1; min-height: 0; margin: 0; border: 0; resize: none; outline: none;
    font: 12.5px/1.45 ui-monospace, "JetBrains Mono", Menlo, monospace;
    background: var(--code-bg); color: var(--text); padding: 10px; overflow: auto; white-space: pre; tab-size: 4;
  }
  pre .err { color: var(--err); }
  #plotPanel { flex: 1; }
  /* Gestures on the plot belong to Plotly and pinch.js, not to page zoom/scroll. */
  #plot { flex: 1; min-height: 320px; touch-action: none; }
  #plot .empty { height: 100%; display: grid; place-items: center; color: var(--muted); padding: 16px; text-align: center; }
  a.dl, button.link { color: var(--accent); text-decoration: none; font-size: 12px; }
  a.dl:hover, button.link:hover { text-decoration: underline; }
  button.link { border: 0; background: none; padding: 0; font-weight: 600; }
  #meshInfo { text-transform: none; letter-spacing: 0; }
  #dropOverlay {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 10;
    background: color-mix(in srgb, var(--bg) 80%, transparent); border: 3px dashed var(--accent);
    font-size: 18px; color: var(--text); pointer-events: none;
  }
  body.dragging #dropOverlay { display: grid; }
  #viewTabs { display: none; }
  #viewTabs .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--err); margin-left: 4px; vertical-align: middle; }
  #viewTabs .dot[hidden] { display: none; }

  /* Phones: one full-height panel at a time, switched by a bottom tab bar. */
  @media (max-width: 760px) {
    html, body { height: 100dvh; }
    header { padding: 8px 12px; gap: 8px; }
    h1 { font-size: 15px; }
    h1 a { font-size: 11px; }
    .controls { margin-left: 0; width: 100%; gap: 6px; }
    #example { flex: 1 1 100%; min-width: 0; }
    .controls > * { flex: 1 1 auto; }
    #status { flex: 1 1 100%; min-width: 0; font-size: 12px; order: 10; }
    select, button, label.file { padding: 8px 10px; min-height: 40px; }
    main { display: flex; flex-direction: column; padding: 8px; gap: 0; }
    .splitter { display: none; }
    .col { flex: 1; min-height: 0; }
    main .col, #editorPanel, #logPanel, #plotPanel { display: none; }
    main[data-view="editor"] .col:first-child, main[data-view="output"] .col:first-child, main[data-view="plot"] .col:last-child { display: flex; }
    main[data-view="editor"] #editorPanel, main[data-view="output"] #logPanel, main[data-view="plot"] #plotPanel { display: flex; flex: 1 1 auto; height: auto; }
    #plot { min-height: 0; }
    /* 16px keeps iOS from zooming the page when the editor gets focus. */
    textarea { font-size: 16px; }
    pre { font-size: 12px; }
    .panel > .title { flex-wrap: wrap; }
    #viewTabs {
      display: flex; border-top: 1px solid var(--border); background: var(--panel);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #viewTabs button {
      flex: 1; border: 0; border-radius: 0; background: none; min-height: 48px;
      color: var(--muted); font-weight: 600; border-top: 2px solid transparent;
    }
    #viewTabs button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }
  }
</style>
</head>
<body>
<header>
  <h1>HOHQMesh <span>· WebAssembly</span><a id="version" target="_blank" rel="noopener" title="HOHQMesh version and upstream commit"></a><a href="https://github.com/hmhaase/hohqmesh-wasm" target="_blank" rel="noopener" title="Source of this site">source</a></h1>
  <div class="controls">
    <select id="example" aria-label="Example"></select>
    <label class="file" title="Open a control file and/or data files (spline or topography). You can also drop files on the page.">
      Open…<input id="open" type="file" multiple>
    </label>
    <button id="save" title="Download the file in the active editor tab">Save</button>
    <button id="theme" title="Colour theme">Theme: auto</button>
    <button id="run" class="primary" title="Ctrl+Enter">Run</button>
    <span id="status">loading…</span>
  </div>
</header>
<main data-view="editor">
  <div class="col">
    <section class="panel" id="editorPanel">
      <div class="tabs" id="tabs" role="tablist"></div>
      <textarea id="editor" spellcheck="false" aria-label="Editor"></textarea>
    </section>
    <div class="splitter h" id="splitH" role="separator" aria-orientation="horizontal" title="Drag to resize, double-click to reset"></div>
    <section class="panel" id="logPanel">
      <div class="title">Output</div>
      <pre id="log"></pre>
    </section>
  </div>
  <div class="splitter v" id="splitV" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
  <div class="col">
    <section class="panel" id="plotPanel">
      <div class="title"><span id="meshInfo">Mesh</span><span class="right"><label class="toggle" id="boundaryToggleLabel" hidden><input type="checkbox" id="boundaryToggle" checked> boundary</label><span class="right" id="downloads"></span></span></div>
      <div id="plot"><div class="empty">Press Run to generate a mesh</div></div>
    </section>
  </div>
</main>
<nav id="viewTabs" role="tablist" aria-label="View">
  <button role="tab" data-view="editor" aria-selected="true">Editor</button>
  <button role="tab" data-view="plot" aria-selected="false">Plot</button>
  <button role="tab" data-view="output" aria-selected="false">Output<span class="dot" id="outputDot" hidden></span></button>
</nav>
<div id="dropOverlay">Drop a .control file and/or data files</div>
<script type="module" src="app.js"></script>
</body>
</html>
